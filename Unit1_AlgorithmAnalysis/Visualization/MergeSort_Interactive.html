<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Merge Sort Visualizer</title>
<style>
:root{--bg:#f8fafc;--fg:#0f172a;--muted:#64748b;--edge:#94a3b8;--dimf:#e2e8f0;--dimb:#cbd5e1;--dimt:#94a3b8;--capbg:#fef3c7;--capfg:#111827;--panel:#e2e8f0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f172a;--fg:#fff;--muted:#94a3b8;--edge:#475569;--dimf:#1e293b;--dimb:#334155;--dimt:#64748b;--panel:#1e293b}}
:root[data-theme="dark"]{--bg:#0f172a;--fg:#fff;--muted:#94a3b8;--edge:#475569;--dimf:#1e293b;--dimb:#334155;--dimt:#64748b;--panel:#1e293b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:14px}
h1{font-size:clamp(20px,3.2vw,30px);margin:0 0 4px;text-align:center}
.top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
#phase{color:#d97706;font-weight:700;font-size:clamp(14px,2vw,19px)}
#cnt{color:var(--muted);font-size:15px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:5px;vertical-align:-2px}
.sv{overflow-x:auto}
svg{width:100%;min-width:760px;display:block}
.c{stroke-width:2}.c.blue{fill:#1d4ed8;stroke:#93c5fd}.c.green{fill:#15803d;stroke:#86efac}.c.orange{fill:#f59e0b;stroke:#fff}
.c.yellow{fill:#fde047;stroke:#fff}.c.dim{fill:var(--dimf);stroke:var(--dimb)}.c.empty{fill:none;stroke:var(--muted);stroke-dasharray:6 5}
.num{font:700 33px system-ui,sans-serif;text-anchor:middle;fill:#fff}.num.orange,.num.yellow{fill:#111827}.num.dim{fill:var(--dimt)}
.glow{fill:none;stroke:#f59e0b;stroke-width:4}.edge{stroke:var(--edge);stroke-width:3}
.lvl{fill:var(--muted);font:15px system-ui,sans-serif}
#cap{background:var(--capbg);color:var(--capfg);border:3px solid #f59e0b;border-radius:14px;padding:14px;text-align:center;font-weight:700;font-size:clamp(17px,2.6vw,26px);margin:8px 0}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;background:var(--panel);border-radius:14px;padding:10px}
button,select,input[type=text]{font:inherit;font-size:16px;padding:9px 14px;border-radius:10px;border:1px solid var(--edge);background:var(--bg);color:var(--fg);cursor:pointer}
button.main{background:#2563eb;color:#fff;border-color:#2563eb;font-weight:700;min-width:110px}
#sl{flex:1 1 100%;width:100%}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px;align-items:center}
input[type=text]{cursor:text;width:min(320px,70vw)}#err{color:#dc2626;font-size:14px}
.hint{text-align:center;color:var(--muted);font-size:13px;margin-top:8px}
</style></head><body><div class="wrap">
<h1>Merge Sort Visualizer</h1>
<div class="top"><div id="phase"></div><div id="cnt"></div></div>
<div class="legend"><span><i style="background:#1d4ed8"></i>not sorted yet</span><span><i style="background:#15803d"></i>sorted</span><span><i style="background:#fde047"></i>being compared</span><span><i style="background:#f59e0b"></i>taken now</span></div>
<div class="sv"><svg id="svg" viewBox="0 0 1900 830"></svg></div>
<div id="cap"></div>
<div class="ctl">
<button id="first">⏮ Restart</button><button id="back">◀ Back</button>
<button id="play" class="main">▶ Play</button>
<button id="next">Next ▶</button>
<label>Speed <select id="spd"><option value="0.5">0.5x (slow)</option><option value="1" selected>1x</option><option value="1.5">1.5x</option><option value="2">2x</option></select></label>
<input id="sl" type="range" min="0" value="0">
</div>
<div class="row"><input id="inp" type="text" value="38, 27, 43, 3, 9, 82, 10, 5" aria-label="8 numbers"><button id="apply">Use my numbers</button><span id="err"></span></div>
<div class="hint">Shortcuts: Space = play/pause, ← → = step. Enter exactly 8 numbers (0–999).</div>
</div>
<script>
const $=id=>document.getElementById(id);
const DUR={divide:2.4,leaf:1.6,take:2.2,done:3};
let A,nodes,events,k=0,timer=null;
function build(arr){
 A=arr;nodes={};events=[];
 const rec=(lo,hi,l)=>{
  const id=lo+"-"+hi;nodes[id]={x:lo+hi,l,div:A.slice(lo,hi),n:hi-lo,lo,hi};
  if(hi-lo==1){nodes[id].srt=A.slice(lo,hi);events.push({t:"leaf",id,cap:`[${A[lo]}] is a single element → already sorted`});return nodes[id].srt}
  const m=(lo+hi)>>1;
  events.push({t:"divide",id,cap:`Split [${A.slice(lo,hi)}] → [${A.slice(lo,m)}] and [${A.slice(m,hi)}]`});
  const L=rec(lo,m,l+1),R=rec(m,hi,l+1);let i=0,j=0,out=[];
  while(i<L.length||j<R.length){
   let side,v,cap;
   if(i<L.length&&j<R.length){side=L[i]<=R[j]?"L":"R";v=side=="L"?L[i]:R[j];cap=`Compare ${L[i]} and ${R[j]} → `+(L[i]==R[j]?"equal, take left first":`${v} is smaller, take it`)}
   else if(i<L.length){side="L";v=L[i];cap=`Right list is empty → copy the remaining ${v}`}
   else{side="R";v=R[j];cap=`Left list is empty → copy the remaining ${v}`}
   events.push({t:"take",id,partial:[...out,v],i,j,side,cap,L:lo+"-"+m,R:m+"-"+hi});
   out.push(v);side=="L"?i++:j++;
  }
  nodes[id].srt=out;return out;
 };
 const f=rec(0,A.length,0);
 events.push({t:"done",id:"0-"+A.length,cap:`Sorted! [${f}]  —  Time: O(n log n)`});
 k=0;$("sl").max=events.length-1;
}
const kids=id=>{const n=nodes[id];if(n.n<2)return[];const m=(n.lo+n.hi)>>1;return[n.lo+"-"+m,m+"-"+n.hi]};
function node(id,vals,sty,glow){
 const n=nodes[id],y=90+215*n.l,tot=vals.length*80-6,x0=(n.x+1.5)*100-tot/2;
 let s=glow?`<rect class="glow" x="${x0-16}" y="${y-56}" width="${tot+32}" height="112" rx="16"/>`:"";
 vals.forEach((v,i)=>{const x=x0+i*80;
  s+=`<rect class="c ${sty[i]}" x="${x}" y="${y-40}" width="74" height="80" rx="9"/>`+(v==null?"":`<text class="num ${sty[i]}" x="${x+37}" y="${y+12}">${v}</text>`)});
 return s;
}
function render(){
 const e=events[k],t=e.t,shown=new Set(),done=new Set();
 for(let q=0;q<=k;q++){const x=events[q];shown.add(x.id);if(x.t=="divide")kids(x.id).forEach(c=>shown.add(c))}
 for(let q=0;q<k;q++){const x=events[q];if(x.t=="leaf"||(x.t=="take"&&x.partial.length==nodes[x.id].n))done.add(x.id)}
 if(t=="done")Object.keys(nodes).forEach(i=>{shown.add(i);done.add(i)});
 let s="";
 for(let l=0;l<4;l++)s+=`<text class="lvl" x="10" y="${96+215*l}">Level ${l}</text>`;
 shown.forEach(id=>kids(id).forEach(c=>{if(shown.has(c)){const a=nodes[id],b=nodes[c];
  s+=`<line class="edge" x1="${(a.x+1.5)*100}" y1="${90+215*a.l+50}" x2="${(b.x+1.5)*100}" y2="${90+215*b.l-50}"/>`}}));
 shown.forEach(id=>{
  const n=nodes[id],cur=id==e.id,glow=cur&&t!="done";
  if(t=="take"&&cur){const p=e.partial,r=n.n-p.length;
   s+=node(id,[...p,...Array(r).fill(null)],[...Array(p.length-1).fill("green"),"orange",...Array(r).fill("empty")],glow)}
  else if(t=="take"&&(id==e.L||id==e.R)){const isL=id==e.L,ptr=isL?e.i:e.j,hit=(e.side=="L")==isL;
   s+=node(id,n.srt,n.srt.map((_,i)=>i<ptr?"dim":i==ptr?(hit?"orange":"yellow"):"green"),false)}
  else if(done.has(id)||t=="done"||(t=="leaf"&&cur))s+=node(id,n.srt,Array(n.n).fill("green"),glow);
  else s+=node(id,n.div,Array(n.n).fill("blue"),glow);
 });
 $("svg").innerHTML=s;
 $("cap").textContent=e.cap;
 $("phase").textContent={divide:"PHASE 1 · DIVIDE (split into two halves)",leaf:"BASE CASE (1 element is already sorted)",take:"PHASE 2 · MERGE (take the smaller front number)",done:"FINISHED"}[t];
 $("cnt").textContent=`Step ${k+1} / ${events.length}`;$("sl").value=k;
}
function stop(){clearTimeout(timer);timer=null;$("play").textContent="▶ Play"}
function tick(){
 if(k>=events.length-1){stop();return}
 timer=setTimeout(()=>{k++;render();tick()},DUR[events[k].t]*1000/parseFloat($("spd").value));
}
function play(){if(k>=events.length-1){k=0;render()}$("play").textContent="⏸ Pause";tick()}
const toggle=()=>timer?stop():play();
const go=n=>{stop();k=Math.max(0,Math.min(events.length-1,n));render()};
$("play").onclick=toggle;$("next").onclick=()=>go(k+1);$("back").onclick=()=>go(k-1);$("first").onclick=()=>go(0);
$("sl").oninput=e=>go(+e.target.value);
$("spd").onchange=()=>{if(timer){clearTimeout(timer);tick()}};
$("apply").onclick=()=>{
 const v=$("inp").value.split(/[\s,]+/).filter(Boolean).map(Number);
 if(v.length!=8||v.some(x=>!Number.isInteger(x)||x<0||x>999)){$("err").textContent="Please enter exactly 8 whole numbers between 0 and 999.";return}
 $("err").textContent="";stop();build(v);render();
};
document.addEventListener("keydown",e=>{
 if(e.target.tagName=="INPUT"&&e.target.type=="text")return;
 if(e.code=="Space"){e.preventDefault();toggle()}
 if(e.key=="ArrowRight")go(k+1);if(e.key=="ArrowLeft")go(k-1);
});
build([38,27,43,3,9,82,10,5]);render();
</script></body></html>
